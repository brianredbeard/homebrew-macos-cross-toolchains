on:
  push:
    branches:
      - 'build/*'
    tags: [ 'v*' ]
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

name: Build

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} for ${{ matrix.os.arch }}
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build') }}
    runs-on: ${{ matrix.os.name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macos-13
            arch: x86_64
          - name: macos-13
            arch: aarch64
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - mipsel-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ matrix.os.name }}-brew-${{ hashFiles('.github/workflows/Build.yml') }}
          restore-keys: |
            ${{ matrix.os.name }}-brew-
      - name: Install crosstool-ng
        run: |
          brew install coreutils gnu-tar gnu-sed make
          brew install --HEAD crosstool-ng

          # Configure PATH to prefer GNU tools
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

          # Fixed python env command with --overwrite flag
          #     # Fix Python availability
          brew unlink python@3.12 && brew link --overwrite python@3.12
          ln -sf $(brew --prefix)/bin/python3 $(brew --prefix)/bin/python
          
          # Verify tools
          which python && python --version
          which python3 && python3 --version
          which make && make --version | head -1
          which tar && tar --version | head -1
      - name: Mount volumes
        run: |
          set -ex
          hdiutil create -type SPARSE -fs 'Case-sensitive Journaled HFS+' -size 18g -volname build build.dmg
          hdiutil create -type SPARSE -fs 'Case-sensitive Journaled HFS+' -size 2g -volname tools tools.dmg
          hdiutil attach build.dmg.sparseimage
          hdiutil attach tools.dmg.sparseimage
          ls /Volumes
      - name: Build Toolchain
        run: |
          set -ex
          mkdir /Volumes/build/src
          cd ${{ matrix.target }}
          ct-ng build -j $(($(nproc) - 1))
      - name: Tail build.log on failure
        if: ${{ failure() }}
        run: |
          echo "=== Host disk space ==="
          df -h /
          echo "=== Mounted volumes ==="
          df -h /Volumes/build /Volumes/tools
          echo "=== Sparse image sizes ==="
          du -h build.dmg.sparseimage tools.dmg.sparseimage
          tail -n 500 ${{ matrix.target }}/build.log
      - name: Archive Toolchain
        run: |
          set -ex
          cd /Volumes/tools
          tar czf ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz ${{ matrix.target }}
          cd -
          mv /Volumes/tools/${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz .
          sha256sum ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz | tee ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz
      - name: Upload Toolchain
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.target }}-${{ matrix.os.arch }}-darwin
          path: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz
          if-no-files-found: error
      - name: Upload Toolchain to GitHub Release
        uses: svenstaro/upload-release-action@v2
        if: "startsWith(github.ref, 'refs/tags/')"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz*
          file_glob: true
          tag: ${{ github.ref }}
