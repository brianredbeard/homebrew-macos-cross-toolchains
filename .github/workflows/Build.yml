on:
  push:
    branches:
      - 'build/*'
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: Build

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} for ${{ matrix.os.arch }}
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI-build') }}
    runs-on: ${{ matrix.os.name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macos-13
            arch: x86_64
          - name: macos-13
            arch: aarch64
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - mipsel-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ matrix.os.name }}-brew-${{ hashFiles('.github/workflows/Build.yml') }}
          restore-keys: |
            ${{ matrix.os.name }}-brew-
      - name: Install crosstool-ng prerequisites
        run: |
          brew install autoconf automake bash berkeley-db@5 binutils bison \
          ca-certificates findutils flex gawk gcc gettext git gnu-sed gnu-tar \
          help2man libtool lzip make ncurses openssl@3 perl readline sqlite \
          texinfo wget xz zstd

          # Configure PATH priority for GNU tools
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix findutils)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix libtool)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix grep)/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix gawk)/libexec/gnubin" >> $GITHUB_PATH

          # LDFLAGS configuration
          echo "LDFLAGS=-L$(brew --prefix)/opt/bison/lib -L$(brew --prefix)/opt/ncurses/lib" >> $GITHUB_ENV

          # CPPFLAGS configuration
          echo "CPPFLAGS=-I$(brew --prefix)/opt/binutils/include -I$(brew --prefix)/opt/ncurses/include" >> $GITHUB_ENV

          # PKG_CONFIG_PATH configuration
          echo "PKG_CONFIG_PATH=$(brew --prefix)/share/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
          echo "CT_MAKE_FOR_BUILD=\"$(command -v gmake)\"" >> $GITHUB_ENV
          echo "CT_MAKE_FOR_HOST=\"$(command -v gmake)\"" >> $GITHUB_ENV
          echo "CT_GDB_CROSS_PYTHON_BINARY=$(brew --prefix python)/bin/python3" >> $GITHUB_ENV

          #Fix up python
          echo "$(brew --prefix python)/libexec/bin" >> $GITHUB_PATH
          for python_package in $(brew list | grep python@); do
            brew unlink ${python_package}
            brew link --overwrite ${python_package}
          done
          ln -sf $(brew --prefix python)/bin/python3 $(brew --prefix)/bin/python
          ln -sf $(brew --prefix python)/bin/python3 $(brew --prefix)/bin/python3
          which python3
          python3 --version

          echo "=== Path Information ==="
          echo "$GITHUB_PATH=$(cat $GITHUB_PATH)"
          echo "=== Environment Information ==="
          echo "$GITHUB_ENV=$(cat $GITHUB_ENV)"
          echo "=== Brew Binaries ==="
          echo "$(find $(brew --prefix)/bin -ls | sort -k 11)"

      - name: Install crosstool-ng
        run: |
          echo "=== Path Information ==="
          echo "$PATH"
          echo "=== Environment Information ==="
          echo "$(env)"
          brew install --HEAD crosstool-ng

      - name: Verify GNU tools are active
        run: |
          echo "=== Tool Verification ==="
          echo "Python: $(which python) -> $(python --version 2>&1)"
          echo "Python3: $(which python3) -> $(python3 --version 2>&1)"
          echo "Make: $(which make) -> $(make --version | head -1)"
          echo "Tar: $(which tar) -> $(tar --version | head -1)"
          echo "Sed: $(which sed) -> $(sed --version | head -1)"
          echo "Grep: $(which grep) -> $(grep --version | head -1)"
          echo "Find: $(which find) -> $(find --version | head -1)"
          echo "Awk: $(which awk) -> $(awk --version | head -1)"

          # Verify these are GNU versions, not BSD
          if ! make --version | grep -q "GNU Make"; then
            echo "❌ GNU Make not found in PATH"
            exit 1
          fi

          if ! tar --version | grep -q "GNU tar"; then
            echo "❌ GNU tar not found in PATH"
            exit 1
          fi

          if ! sed --version | grep -q "GNU sed"; then
            echo "❌ GNU sed not found in PATH"
            exit 1
          fi

          echo "✅ All GNU tools verified"
      - name: Mount volumes
        run: |
          set -ex
          hdiutil create -type SPARSE -fs 'Case-sensitive Journaled HFS+' -size 18g -volname build build.dmg
          hdiutil create -type SPARSE -fs 'Case-sensitive Journaled HFS+' -size 2g -volname tools tools.dmg
          hdiutil attach build.dmg.sparseimage
          hdiutil attach tools.dmg.sparseimage
          ls /Volumes
      - name: Build Toolchain
        run: |
          set -ex
          mkdir /Volumes/build/src
          cd ${{ matrix.target }}
          ct-ng build -j $(($(nproc) - 1))
      - name: Tail build.log on failure
        if: ${{ failure() }}
        run: |
          echo "=== Host disk space ==="
          df -h /
          echo "=== Mounted volumes ==="
          df -h /Volumes/build /Volumes/tools
          echo "=== Sparse image sizes ==="
          du -h build.dmg.sparseimage tools.dmg.sparseimage
          find /Volumes -name build.log
          tail -n 500 /Volumes/build/src/${{ matrix.target }}/build.log
      - name: Archive Toolchain
        run: |
          set -ex
          cd /Volumes/tools
          tar czf ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz ${{ matrix.target }}
          cd -
          mv /Volumes/tools/${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz .
          sha256sum ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz | tee ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz
      - name: Upload Toolchain
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.target }}-${{ matrix.os.arch }}-darwin
          path: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz
          if-no-files-found: error
      - name: Upload Toolchain to GitHub Release
        uses: svenstaro/upload-release-action@v2
        if: "startsWith(github.ref, 'refs/tags/')"
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.target }}-${{ matrix.os.arch }}-darwin.tar.gz*
          file_glob: true
          tag: ${{ github.ref }}
